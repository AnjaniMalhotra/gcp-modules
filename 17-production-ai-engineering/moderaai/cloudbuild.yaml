# NOTE on build context: this file is invoked two ways -
#   1) manually (02_cloud_build_manual.bat), run from the repo root so
#      /workspace = the whole repo, same as case 2 below
#   2) via the CI/CD trigger (topic 3), which always checks out the WHOLE
#      connected repo to /workspace, never just this module's subfolder
# Both cases put /workspace at the repo root, so every step below points at
# this module's folder explicitly via `dir:` rather than assuming '.' is it.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    dir: '17-production-ai-engineering/moderaai'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/moderaai-repo/moderaai:${_TAG}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/moderaai-repo/moderaai:${_TAG}']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - moderaai
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/moderaai-repo/moderaai:${_TAG}'
      - '--region=${_REGION}'
      - '--allow-unauthenticated'
substitutions:
  _REGION: us-central1
  _TAG: latest
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/moderaai-repo/moderaai:${_TAG}'
